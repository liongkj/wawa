services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    mem_limit: 2g
    environment:
      NODE_ENV: production
      LOG_LEVEL: error
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      DATABASE_SYNCHRONIZE: 'true'
      ENGINE_TYPE: ${WAWA_ENGINE:?Choose a WhatsApp connection}
      AUTO_START_SESSIONS: 'true'
      SSRF_ALLOWED_HOSTS: wawa
      UPDATE_CHECK_ENABLED: 'false'
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 75s

  gateway-key:
    image: node:24-bookworm-slim
    user: '0:0'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - 'install -m 600 -o 1000 -g 1000 /openwa/.api-key /wawa-key/openwa.key'
    volumes:
      - openwa-data:/openwa:ro
      - gateway-key:/wawa-key
    depends_on:
      openwa:
        condition: service_healthy

  wawa:
    image: ${WAWA_IMAGE:-ghcr.io/liongkj/wawa:latest}
    build:
      context: ../..
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WAWA_PORT:?Choose a local port}:2786'
    environment:
      WAWA_MANAGED_SERVER: 'true'
      DESKTOP_OPENWA_URL: http://openwa:2785
      DESKTOP_OPENWA_KEY_FILE: /run/wawa-gateway/openwa.key
      DESKTOP_WEBHOOK_URL: http://wawa:2786/api/webhooks/openwa
      DESKTOP_GATEWAY_ENGINE: ${WAWA_ENGINE:?Choose a WhatsApp connection}
      PUBLIC_ORIGIN: ${WAWA_ORIGIN:?Set the private HTTPS address}
      APP_PASSWORD:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - workspace-data:/app/data
      - codex-home:/home/node/.codex
      - gateway-key:/run/wawa-gateway:ro
    depends_on:
      gateway-key:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  # Public route with a domain: certificates from Let's Encrypt, then proxy to Wawa.
  caddy:
    image: caddy:2
    profiles: [domain]
    restart: unless-stopped
    command: ['caddy', 'reverse-proxy', '--from', '${WAWA_DOMAIN:-}', '--to', 'wawa:2786']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - wawa
    security_opt:
      - no-new-privileges:true

  # Tailscale at your own domain: the domain is a CNAME to this server's tailnet name, so only
  # the tailnet can reach it. Caddy proves the domain over Cloudflare DNS, which needs the
  # Cloudflare DNS plugin, and Tailscale Serve passes TLS through to it on loopback.
  caddy-tailnet:
    image: wawa-caddy-cloudflare:local
    build:
      dockerfile_inline: |
        FROM caddy:2-builder AS builder
        RUN xcaddy build --with github.com/caddy-dns/cloudflare
        FROM caddy:2
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    profiles: [tailscale-domain]
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    configs:
      - source: caddy-tailnet
        target: /etc/caddy/Caddyfile
    ports:
      - '127.0.0.1:${WAWA_TLS_PORT:-0}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - wawa
    security_opt:
      - no-new-privileges:true

  # Cloudflare Tunnel: dials out to Cloudflare, so no port forwarding is needed.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - wawa
    security_opt:
      - no-new-privileges:true

configs:
  caddy-tailnet:
    content: |
      ${WAWA_DOMAIN:-localhost} {
        tls {
          dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        }
        reverse_proxy wawa:2786
      }

volumes:
  openwa-data:
  gateway-key:
  workspace-data:
  codex-home:
  caddy-data:
  caddy-config:
